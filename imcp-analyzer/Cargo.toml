[package]
name = "imcp-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
imcp = { path = "../../imcp-rs" }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
chrono = "0.4"
tui = "0.19"
crossterm = "0.26"
anyhow = "1.0"
thiserror = "1.0"
env_logger = "0.10"
log = "0.4"
tungstenite = { version = "0.18", features = ["native-tls"] }
