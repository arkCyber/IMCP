[package]
name = "imcp"
version = "0.1.0"
edition = "2021"
authors = ["IMCP Team"]
description = "Industrial Model Context Protocol implementation in Rust"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
ring = "0.16"
bincode = "1.3"
rand = "0.8"
tungstenite = { version = "0.18", features = ["native-tls"] }
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"

[[example]]
name = "basic"
path = "examples/basic.rs"
